spring:
  application:
    name: product-service
  config:
    import: "optional:configserver:http://localhost:8888"
  cloud:
    config:
      username: ${CONFIG_USERNAME:admin}
      password: ${CONFIG_PASSWORD:config123}
  rabbitmq:
    host: localhost
    port: 5672
    username: ${RABBITMQ_USERNAME:admin}
    password: ${RABBITMQ_PASSWORD:admin123456}
  data:
    mongodb:
      uri: ${MONGODB_URI:mongodb://localhost:27017/ecommerce}
    redis:
      host: ${REDIS_HOST:localhost}
      port: 6379

  # Redis 快取設定
  cache:
    type: redis
    redis:
      time-to-live: 600000   # 10 分鐘 TTL

eureka:
  client:
    service-url:
      defaultZone: http://${EUREKA_USERNAME:admin}:${EUREKA_PASSWORD:eureka123}@localhost:8761/eureka/
  instance:
    prefer-ip-address: true
    lease-renewal-interval-in-seconds: 10
    lease-expiration-duration-in-seconds: 30

management:
  endpoints:
    web:
      exposure:
        include: health,info,refresh,metrics
  tracing:
    sampling:
      probability: 1.0
  zipkin:
    tracing:
      endpoint: ${ZIPKIN_ENDPOINT:http://localhost:9411}/api/v2/spans

jwt:
  secret: ${JWT_SECRET:ecommerce-jwt-secret-key-2026-must-be-at-least-256-bits-long}
  expiration: 86400000

# ─── SpringDoc OpenAPI (Swagger UI) ────────────────────────────────────────────
springdoc:
  api-docs:
    path: /v3/api-docs
  swagger-ui:
    path: /swagger-ui/index.html
    operationsSorter: method
    tagsSorter: alpha
    disable-swagger-default-url: true
  show-actuator: false
